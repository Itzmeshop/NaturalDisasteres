<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баланс Стихий: Спаси Экосистему</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #1e272e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: #2f3640;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #4cd137;
        }

        /* Панель состояния */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #353b48;
            padding: 15px;
            border-radius: 10px;
        }

        .stat-box {
            font-size: 18px;
            font-weight: bold;
        }

        #energy-count { color: #fbc531; }
        #score-count { color: #00a8ff; }

        /* Полоса здоровья экосистемы */
        .progress-container {
            width: 100%;
            background-color: #718093;
            border-radius: 10px;
            margin-bottom: 20px;
            position: relative;
            height: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background-color: #4cd137;
            border-radius: 10px;
            transition: width 0.3s ease, background-color 0.5s ease;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 3px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* Игровое поле (Визуализация природы) */
        #eco-viewport {
            width: 100%;
            height: 300px;
            background: linear-gradient(to bottom, #74b9ff, #55efc4);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 4px solid #353b48;
            transition: background 1s ease;
        }

        /* Элементы природы */
        .tree {
            position: absolute;
            bottom: 20px;
            font-size: 40px;
            transition: transform 0.3s;
        }

        /* Текст катастрофы */
        #disaster-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #e84118;
            text-shadow: 2px 2px 4px #000;
            display: none;
            animation: pulse 1s infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Панель действий */
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            background: #353b48;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover { background: #487eb0; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled {
            background: #718093;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Специфические цвета для кнопок защиты */
        #btn-water { border-bottom: 4px solid #00a8ff; }
        #btn-fire { border-bottom: 4px solid #e84118; }
        #btn-plant { border-bottom: 4px solid #4cd137; }

        /* Экран завершения игры */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        #game-over-screen h2 {
            font-size: 40px;
            color: #e84118;
            margin-bottom: 10px;
        }

        #restart-btn {
            background: #4cd137;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }
        #restart-btn:hover { background: #44bd32; }

        /* Эффекты стихий на экране */
        .disaster-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Симулятор Экосистемы: Баланс Природы</h1>

    <div class="stats">
        <div class="stat-box">Энергия: <span id="energy-count">50</span> ⚡</div>
        <div class="stat-box">Дней прожито: <span id="score-count">0</span> 📅</div>
    </div>

    <!-- Индикатор здоровья природы -->
    <div class="progress-container">
        <div id="eco-health-bar" class="progress-bar"></div>
        <div class="progress-text">Здоровье Экосистемы: <span id="health-text">100</span>%</div>
    </div>

    <!-- Игровое поле -->
    <div id="eco-viewport">
        <div id="disaster-overlay-layer" class="disaster-overlay"></div>
        <div id="disaster-alert">ПОЖАР!</div>
        <!-- Тут будут появляться деревья -->
        <div id="nature-objects"></div>
    </div>

    <!-- Кнопки управления -->
    <div class="actions">
        <button id="btn-water" class="btn" onclick="applyAction('water')">Вызвать Дождь (15 ⚡)</button>
        <button id="btn-fire" class="btn" onclick="applyAction('fire')">Тушить Пожар (20 ⚡)</button>
        <button id="btn-plant" class="btn" onclick="applyAction('plant')">Посадить Лес (10 ⚡)</button>
    </div>

    <!-- Экран Game Over -->
    <div id="game-over-screen">
        <h2>Экосистема разрушена!</h2>
        <p style="font-size: 20px;">Вы смогли удерживать баланс природы <span id="final-score">0</span> дней.</p>
        <button id="restart-btn" onclick="startGame()">Начать заново</button>
    </div>
</div>

<script>
    // Игровые переменные
    let health = 100;
    let energy = 50;
    let score = 0;
    let currentDisaster = null; // 'fire', 'drought', 'flood', null
    let gameInterval;
    let disasterInterval;
    let energyInterval;

    const healthBar = document.getElementById('eco-health-bar');
    const healthText = document.getElementById('health-text');
    const energyCount = document.getElementById('energy-count');
    const scoreCount = document.getElementById('score-count');
    const disasterAlert = document.getElementById('disaster-alert');
    const viewport = document.getElementById('eco-viewport');
    const overlay = document.getElementById('disaster-overlay-layer');
    const natureObjects = document.getElementById('nature-objects');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('final-score');

    // Список катастроф и их параметров
    const disasters = {
        fire: { name: 'ПОЖАР! 🔥', color: 'rgba(232, 65, 24, 0.4)', damage: 5, bg: 'linear-gradient(to bottom, #d63031, #2f3640)' },
        drought: { name: 'ЗАСУХА! ☀️', color: 'rgba(251, 197, 49, 0.3)', damage: 4, bg: 'linear-gradient(to bottom, #f5cd79, #e67e22)' },
        flood: { name: 'НАВОДНЕНИЕ! 🌊', color: 'rgba(0, 168, 255, 0.4)', damage: 4, bg: 'linear-gradient(to bottom, #2881e0, #1e272e)' }
    };

    // Старт игры
    function startGame() {
        health = 100;
        energy = 60;
        score = 0;
        currentDisaster = null;
        gameOverScreen.style.display = 'none';
        viewport.style.background = 'linear-gradient(to bottom, #74b9ff, #55efc4)';
        overlay.style.opacity = 0;
        disasterAlert.style.display = 'none';
        
        updateUI();
        generateTrees();

        // Очистка старых таймеров, если они были
        clearInterval(gameInterval);
        clearInterval(disasterInterval);
        clearInterval(energyInterval);

        // Запуск циклов игры
        gameInterval = setInterval(gameTick, 1000); // Каждый день
        disasterInterval = setInterval(randomDisasterEvent, 7000); // Шанс катастрофы каждые 7 сек
        energyInterval = setInterval(() => {
            if (energy < 100) {
                energy = Math.min(100, energy + 7);
                updateUI();
            }
        }, 1200);
    }

    // Обновление интерфейса
    function updateUI() {
        healthBar.style.width = health + '%';
        healthText.innerText = Math.round(health);
        energyCount.innerText = energy;
        scoreCount.innerText = score;

        // Цвет полосы здоровья в зависимости от состояния
        if (health > 60) healthBar.style.backgroundColor = '#4cd137';
        else if (health > 30) healthBar.style.backgroundColor = '#fbc531';
        else healthBar.style.backgroundColor = '#e84118';

        // Проверка доступности кнопок по энергии
        document.getElementById('btn-water').disabled = (energy < 15);
        document.getElementById('btn-fire').disabled = (energy < 20);
        document.getElementById('btn-plant').disabled = (energy < 10);
    }

    // Каждый "день" (секунду)
    function gameTick() {
        score++;
        
        if (currentDisaster) {
            health -= disasters[currentDisaster].damage;
            // Анимация тряски деревьев при катастрофе
            shakeTrees();
        } else {
            // Естественная регенерация, если всё спокойно
            if (health < 100) health = Math.min(100, health + 1);
        }

        updateUI();

        if (health <= 0) {
            endGame();
        }
    }

    // Случайное появление катастроф
    function randomDisasterEvent() {
        if (currentDisaster) return; // Если уже идет катастрофа, новую не создаем

        const disasterKeys = Object.keys(disasters);
        const randomKey = disasterKeys[Math.floor(Math.random() * disasterKeys.length)];
        
        triggerDisaster(randomKey);
    }

    function triggerDisaster(type) {
        currentDisaster = type;
        const info = disasters[type];
        
        disasterAlert.innerText = info.name;
        disasterAlert.style.display = 'block';
        overlay.style.background = info.color;
        overlay.style.opacity = 1;
        viewport.style.background = info.bg;
    }

    function stopDisaster() {
        currentDisaster = null;
        disasterAlert.style.display = 'none';
        overlay.style.opacity = 0;
        viewport.style.background = 'linear-gradient(to bottom, #74b9ff, #55efc4)';
    }

    // Действия игрока
    function applyAction(action) {
        if (action === 'water' && energy >= 15) {
            energy -= 15;
            if (currentDisaster === 'drought') {
                stopDisaster();
                health = Math.min(100, health + 15);
            } else {
                health = Math.min(100, health + 5); // Просто полив
            }
        } 
        else if (action === 'fire' && energy >= 20) {
            energy -= 20;
            if (currentDisaster === 'fire') {
                stopDisaster();
                health = Math.min(100, health + 15);
            }
        } 
        else if (action === 'plant' && energy >= 10) {
            energy -= 10;
            health = Math.min(100, health + 10);
            if (currentDisaster === 'flood') {
                // Корни деревьев впитывают воду
                stopDisaster();
            }
            addTree();
        }
        updateUI();
    }

    // Визуализация деревьев
    function generateTrees() {
        natureObjects.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            addTree();
        }
    }

    function addTree() {
        const tree = document.createElement('div');
        tree.className = 'tree';
        tree.innerText = Math.random() > 0.5 ? '🌳' : '🌲';
        tree.style.left = Math.random() * 90 + '%';
        // Немного разного размера для реализма
        const scale = 0.6 + Math.random() * 0.5;
        tree.style.transform = `scale(${scale})`;
        natureObjects.appendChild(tree);
    }

    function shakeTrees() {
        const trees = document.querySelectorAll('.tree');
        trees.forEach(tree => {
            const currentTransform = tree.style.transform.split(' ')[0]; // сохраняем масштаб
            const angle = (Math.random() - 0.5) * 20; // угол наклона
            tree.style.transform = `${currentTransform} rotate(${angle}deg)`;
        });
    }

    // Конец игры
    function endGame() {
        clearInterval(gameInterval);
        clearInterval(disasterInterval);
        clearInterval(energyInterval);
        
        finalScore.innerText = score;
        gameOverScreen.style.display = 'flex';
    }

    // Запуск при загрузке
    window.onload = startGame;
</script>
</body>
</html>
