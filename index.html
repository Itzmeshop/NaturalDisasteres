loper":{"name":"WebGames","id":78131,"residence_info":{"EU":false}},"categoryIDs":[2,16],"title":"Выживание на Плоту - Рафт","appID":387470,"ratingCount":7508,"rating":4.5,"url":"https://app-387470.cdn.games.yandex.net/387470/tavtoi8g5x4bap9g6331rdteua7jjcu3_brotli/index.html","categoriesNames":["adventure","simulator"],"description":"В нашей захватывающей выживалке вы окажетесь один на один с океаном, находясь на плоту. Вас ждёт настоящее выживание на плоту в игре с сюжетом, где каждая мелочь может стать ключом к спасению. Собирайте обломки, деревяшки, верёвки и бутылки, чтобы увеличивать плот, готовить еду, добывать пресную воду и исследовать острова. Всё, что когда-то казалось вам мусором – теперь становится вашей надеждой на спасение. \n\nВас ждут приключения в игре симуляторе, где кровожадные акулы будут разрушать ваш плот. Вам придётся отбиваться от морских хищников, следить за показателями голода, жажды и здоровья, чтобы выжить. Ловите рыбу, стройте плот, крафтите инструменты и находите способы выживания.\n\nНаша уникальная рафт игра — это одна из лучших сюжетных игр, где каждое действие важно, она понравится всем любителям игр на выживание. Попробуйте выживание на плоту, исследуйте океан и окунитесь в мир рафт приключений. Время попробовать прикольные игры выживалки в лучших традициях игр на прохождение!","instruction":"Используйте крюк, чтобы собрать ресурсы из океана: обломки, бочки и ящики.\nКонтролируйте уровень здоровья, голода и жажды.\nЛовите рыбу и собирайте питьевую воду.\nВыполняйте задания, чтобы получить ценные награды.\nРасширяйте плот и укрепляйте его от атак акул.\nСоздавайте инструменты и оружие из собранных материалов.\nУзнайте больше о причинах апокалипсиса в игре с сюжетом и найдите способ спастись.","seoDescription":"Реалистичный симулятор выживания на плоту в океане! Время приключений в захватывающей игре-симуляторе начинается!","generatedTitle":"Выживание на Плоту - Рафт","seoTitle":"Выживание на Плоту - Рафт - играть онлайн бесплатно н
